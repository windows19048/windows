<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经典贪吃蛇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1a1a1a;
            color: #fff;
            padding-top: 20px;
        }
        #gameBox {
            border: 3px solid #4cd964;
            background: #000;
            max-width: 100%;
        }
        .info {
            margin-bottom: 12px;
            font-size: 20px;
        }
        .btn-group button {
            margin: 6px;
            padding: 8px 22px;
            font-size: 16px;
            background: #4cd964;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-group button:hover {
            background: #3bc053;
        }
        /* 手机虚拟方向按键 */
        .control-panel {
            margin-top: 16px;
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(3, 70px);
            gap: 6px;
        }
        .control-panel button {
            font-size: 24px;
            background: #2d2d2d;
            color: #4cd964;
            border: 2px solid #4cd964;
            border-radius: 8px;
        }
        .control-panel .empty {
            visibility: hidden;
        }
    </style>
</head>
<body>
    <div class="info">得分：<span id="score">0</span></div>
    <canvas id="gameBox" width="400" height="400"></canvas>
    <div class="btn-group">
        <button onclick="startGame()">重新开始游戏</button>
    </div>
    <p style="margin-top:10px;margin-bottom:12px">电脑：方向键控制 | 手机：点击下方按键</p>

    <!-- 移动端触控按钮 -->
    <div class="control-panel">
        <div class="empty"></div>
        <button onclick="changeDir('up')">↑</button>
        <div class="empty"></div>
        <button onclick="changeDir('left')">←</button>
        <div class="empty"></div>
        <button onclick="changeDir('right')">→</button>
        <div class="empty"></div>
        <button onclick="changeDir('down')">↓</button>
        <div class="empty"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameBox');
        const ctx = canvas.getContext('2d');
        const scoreText = document.getElementById('score');

        const size = 20;
        let snake = [{x:10, y:10}];
        let food = {};
        let dir = {x:1, y:0};
        let nextDir = {x:1, y:0};
        let score = 0;
        let timer = null;
        // 调慢速度：数值越大移动越慢，原来120，现在改成180
        const speedInterval = 180;

        function createFood(){
            return {
                x: Math.floor(Math.random()*(canvas.width/size)),
                y: Math.floor(Math.random()*(canvas.height/size))
            }
        }

        function draw(){
            ctx.fillStyle="#000";
            ctx.fillRect(0,0,canvas.width,canvas.height);

            ctx.fillStyle="#4cd964";
            snake.forEach(seg=>{
                ctx.fillRect(seg.x*size, seg.y*size, size-1, size-1);
            })

            ctx.fillStyle="#ff3b30";
            ctx.fillRect(food.x*size, food.y*size, size-1, size-1);
        }

        function update(){
            dir = {...nextDir};
            const head = {x:snake[0].x + dir.x, y:snake[0].y + dir.y};
            
            if(head.x<0||head.y<0||head.x>=canvas.width/size||head.y>=canvas.height/size){
                clearInterval(timer);
                alert("游戏结束！得分："+score);
                return;
            }
            for(let seg of snake){
                if(seg.x===head.x&&seg.y===head.y){
                    clearInterval(timer);
                    alert("游戏结束！得分："+score);
                    return;
                }
            }

            snake.unshift(head);
            if(head.x===food.x&&head.y===food.y){
                score +=10;
                scoreText.innerText = score;
                food = createFood();
            }else{
                snake.pop();
            }
            draw();
        }

        // 键盘控制
        document.addEventListener('keydown',e=>{
            switch(e.key){
                case "ArrowUp": if(dir.y!==1) nextDir={x:0,y:-1}; break;
                case "ArrowDown": if(dir.y!==-1) nextDir={x:0,y:1}; break;
                case "ArrowLeft": if(dir.x!==1) nextDir={x:-1,y:0}; break;
                case "ArrowRight": if(dir.x!==-1) nextDir={x:1,y:0}; break;
            }
        })

        // 手机按钮控制
        function changeDir(type) {
            switch(type) {
                case 'up': if(dir.y!==1) nextDir={x:0,y:-1}; break;
                case 'down': if(dir.y!==-1) nextDir={x:0,y:1}; break;
                case 'left': if(dir.x!==1) nextDir={x:-1,y:0}; break;
                case 'right': if(dir.x!==-1) nextDir={x:1,y:0}; break;
            }
        }

        function startGame(){
            clearInterval(timer);
            snake = [{x:10,y:10}];
            dir = {x:1,y:0};
            nextDir = {x:1,y:0};
            score = 0;
            scoreText.innerText = 0;
            food = createFood();
            draw();
            timer = setInterval(update, speedInterval);
        }
        startGame();
    </script>
</body>
</html>
