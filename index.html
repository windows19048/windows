<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网页版 Windows 11</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",sans-serif;user-select:none;}
body{height:100vh;overflow:hidden;background:url('https://img2.baidu.com/it/u=1268128823,3083623219&fm=253&fmt=auto&app=138&f=JPEG?w=1920&h=1080');background-size:cover;background-position:center;position:relative;}

/* 桌面图标 */
.desktop-icon{width:80px;text-align:center;color:#fff;position:absolute;cursor:pointer;padding:6px;border-radius:4px;transition: background 0.2s ease;}
.desktop-icon:hover{background:rgba(255,255,255,0.15);}
.desktop-icon img{width:40px;height:40px;object-fit:contain;}
.desktop-icon span{font-size:13px;display:block;text-shadow:0 0 4px #000;}

/* 任务栏 */
.taskbar{position:fixed;bottom:0;left:0;right:0;height:48px;background:rgba(20,20,20,0.65);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:8px;z-index:999;}
.taskbar-center{display:flex;gap:8px;align-items:center;}
.taskbar-right{color:#fff;font-size:13px;padding:0 8px;}
.taskbar-btn{width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;cursor:pointer;transition: background 0.2s ease;}
.taskbar-btn:hover{background:rgba(255,255,255,0.15);}
/* 任务栏运行窗口按钮 */
.taskbar-app{
    height:36px;
    padding:0 10px;
    background:rgba(255,255,255,0.08);
    border-radius:6px;
    color:#fff;
    font-size:13px;
    display:flex;
    align-items:center;
    cursor:pointer;
    transition:0.2s ease;
}
.taskbar-app:hover{background:rgba(255,255,255,0.18);}
.taskbar-app.active{background:rgba(255,255,255,0.25);}

/* 开始菜单 带动画 */
.start-menu{position:fixed;bottom:52px;left:50%;transform:translateX(-50%) scale(0.95);opacity:0;width:600px;height:480px;background:rgba(22,22,22,0.8);backdrop-filter:blur(18px);border-radius:12px;padding:18px;color:#fff;z-index:998;pointer-events:none;transition: all 0.22s ease;}
.start-menu.open{transform:translateX(-50%) scale(1);opacity:1;pointer-events:auto;}
.search-box{width:100%;padding:10px 14px;background:#333;border:none;border-radius:6px;color:#fff;font-size:14px;margin-bottom:16px;outline:none;}

/* 窗口样式 打开动画 */
.window{position:absolute;width:700px;height:460px;background:#1c1c1c;border-radius:8px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.4);opacity:0;transform:scale(0.92);pointer-events:none;transition: all 0.2s ease;}
.window.show{opacity:1;transform:scale(1);pointer-events:auto;display:block;}
.window.active{box-shadow:0 12px 40px rgba(0,0,0,0.55);}
.window-header{height:36px;background:#2b2b2b;display:flex;align-items:center;padding:0 10px;cursor:move;}
.window-title{flex:1;color:#eee;font-size:13px;}
.window-controls{display:flex;gap:4px;}
.win-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#ddd;cursor:pointer;font-size:16px;transition:0.15s ease;}
.win-btn:hover{background:rgba(255,255,255,0.1);}
.win-btn.close:hover{background:#e81123;color:#fff;}
.window-content{height:calc(100% - 36px);padding:12px;color:#eee;overflow:auto;}

/* 浏览器内部样式 */
.browser-toolbar{display:flex;gap:6px;align-items:center;padding:6px 8px;background:#272727;}
.browser-nav{display:flex;gap:4px;}
.browser-nav button{width:28px;height:28px;background:#383838;border:none;color:#fff;border-radius:4px;cursor:pointer;}
.browser-url{flex:1;padding:6px 10px;background:#383838;border:none;border-radius:4px;color:#fff;outline:none;}
#browser-frame{width:100%;height:calc(100% - 42px);border:none;background:#fff;}

/* 右键菜单 淡入动画 */
.rightmenu{position:fixed;width:200px;background:rgba(20,20,20,0.85);backdrop-filter:blur(10px);border-radius:6px;padding:6px;opacity:0;transform:scale(0.96);pointer-events:none;transition: all 0.15s ease;z-index:1000;}
.rightmenu.open{opacity:1;transform:scale(1);pointer-events:auto;}
.rt-item{padding:8px 12px;color:#eee;font-size:14px;cursor:pointer;border-radius:4px;transition: background 0.18s ease;}
.rt-item:hover{background:rgba(255,255,255,0.12);}
</style>
</head>
<body>
<!-- 桌面图标 -->
<div class="desktop-icon" style="top:30px;left:30px;" ondblclick="openWindow('explorer','文件资源管理器')">
    <img src="https://cdn-icons-png.flaticon.com/512/1156/1156873.png">
    <span>此电脑</span>
</div>
<div class="desktop-icon" style="top:130px;left:30px;" ondblclick="openWindow('notepad','记事本')">
    <img src="https://cdn-icons-png.flaticon.com/512/2933/2933822.png">
    <span>记事本</span>
</div>
<div class="desktop-icon" style="top:230px;left:30px;" ondblclick="openWindow('edge','Edge浏览器')">
    <img src="https://cdn-icons-png.flaticon.com/512/1051/1051271.png">
    <span>Edge浏览器</span>
</div>

<!-- 开始菜单 -->
<div class="start-menu" id="startMenu">
    <input class="search-box" placeholder="搜索应用、设置和文档">
    <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;">
        <div class="desktop-icon" onclick="openWindow('explorer','文件资源管理器')">
            <img src="https://cdn-icons-png.flaticon.com/512/1156/1156873.png"><span>文件资源管理器</span>
        </div>
        <div class="desktop-icon" onclick="openWindow('notepad','记事本')">
            <img src="https://cdn-icons-png.flaticon.com/512/2933/2933822.png"><span>记事本</span>
        </div>
        <div class="desktop-icon" onclick="openWindow('edge','Edge浏览器')">
            <img src="https://cdn-icons-png.flaticon.com/512/1051/1051271.png"><span>Edge浏览器</span>
        </div>
    </div>
</div>

<!-- 窗口容器 -->
<div class="window" id="win-explorer">
    <div class="window-header" onmousedown="dragWindow(event,'win-explorer')">
        <div class="window-title">文件资源管理器</div>
        <div class="window-controls">
            <div class="win-btn" onclick="minWindow('win-explorer')">−</div>
            <div class="win-btn" onclick="maxWindow('win-explorer')">□</div>
            <div class="win-btn close" onclick="closeWindow('win-explorer')">×</div>
        </div>
    </div>
    <div class="window-content">欢迎来到文件资源管理器</div>
</div>

<div class="window" id="win-notepad">
    <div class="window-header" onmousedown="dragWindow(event,'win-notepad')">
        <div class="window-title">记事本</div>
        <div class="window-controls">
            <div class="win-btn" onclick="minWindow('win-notepad')">−</div>
            <div class="win-btn" onclick="maxWindow('win-notepad')">□</div>
            <div class="win-btn close" onclick="closeWindow('win-notepad')">×</div>
        </div>
    </div>
    <div class="window-content">
        <textarea style="width:100%;height:100%;background:#111;color:#fff;border:none;outline:none;font-size:14px;" placeholder="在此输入文字..."></textarea>
    </div>
</div>

<!-- Edge浏览器窗口 -->
<div class="window" id="win-edge">
    <div class="window-header" onmousedown="dragWindow(event,'win-edge')">
        <div class="window-title">Edge浏览器</div>
        <div class="window-controls">
            <div class="win-btn" onclick="minWindow('win-edge')">−</div>
            <div class="win-btn" onclick="maxWindow('win-edge')">□</div>
            <div class="win-btn close" onclick="closeWindow('win-edge')">×</div>
        </div>
    </div>
    <div class="window-content" style="padding:0;">
        <div class="browser-toolbar">
            <div class="browser-nav">
                <button onclick="browserBack()">←</button>
                <button onclick="browserForward()">→</button>
                <button onclick="browserReload()">⟳</button>
            </div>
            <input class="browser-url" id="browserUrl" value="https://www.bing.com" placeholder="输入网址" onkeydown="if(event.key==='Enter')browserGo()">
        </div>
        <iframe id="browser-frame" src="https://www.bing.com"></iframe>
    </div>
</div>

<!-- 右键菜单 -->
<div class="rightmenu" id="rightMenu">
    <div class="rt-item">查看</div>
    <div class="rt-item">刷新</div>
    <div class="rt-item">新建</div>
    <div class="rt-item">个性化</div>
</div>

<!-- 任务栏 -->
<div class="taskbar">
    <div></div>
    <div class="taskbar-center" id="taskbarCenter">
        <div class="taskbar-btn" onclick="toggleStartMenu()">⊞</div>
    </div>
    <div class="taskbar-right" id="clock"></div>
</div>

<script>
// 时钟
function updateClock(){
    const now = new Date();
    document.getElementById('clock').innerText = now.toLocaleString('zh-CN',{hour:'2-digit',minute:'2-digit'});
}
setInterval(updateClock,1000);
updateClock();

// 全局变量
const startMenu = document.getElementById('startMenu');
let zIndex = 10;
const winState = {};
// 窗口名称映射（新增edge浏览器）
const winNameMap = {
    "win-explorer":"文件资源管理器",
    "win-notepad":"记事本",
    "win-edge":"Edge浏览器"
};
const taskbarCenter = document.getElementById('taskbarCenter');

// 浏览器控制函数
function browserGo(){
    const urlInput = document.getElementById('browserUrl');
    const frame = document.getElementById('browser-frame');
    let url = urlInput.value.trim();
    if(!url.startsWith("http")) url = "https://" + url;
    frame.src = url;
}
function browserBack(){
    const frame = document.getElementById('browser-frame');
    try{frame.contentWindow.history.back()}catch(e){}
}
function browserForward(){
    const frame = document.getElementById('browser-frame');
    try{frame.contentWindow.history.forward()}catch(e){}
}
function browserReload(){
    const frame = document.getElementById('browser-frame');
    frame.src = frame.src;
}

// 刷新任务栏应用按钮
function refreshTaskbarApps(){
    const startBtn = taskbarCenter.querySelector('.taskbar-btn');
    taskbarCenter.innerHTML = "";
    taskbarCenter.appendChild(startBtn);

    document.querySelectorAll('.window').forEach(win=>{
        const winId = win.id;
        const title = winNameMap[winId];
        const isShow = win.classList.contains('show');

        const btn = document.createElement('div');
        btn.className = 'taskbar-app ' + (isShow ? 'active' : '');
        btn.innerText = title;
        btn.onclick = ()=>restoreWindow(winId);
        taskbarCenter.appendChild(btn);
    })
}

// 点击任务栏图标：恢复窗口
function restoreWindow(winId){
    const win = document.getElementById(winId);
    if(win.classList.contains('show')){
        setTop(win);
    }else{
        win.style.display='block';
        setTimeout(()=>{
            win.classList.add('show');
            setTop(win);
            refreshTaskbarApps();
        },10);
    }
    startMenu.classList.remove('open');
}

// 窗口置顶
function setTop(win){
    zIndex++;
    win.style.zIndex = zIndex;
    document.querySelectorAll('.window').forEach(w=>w.classList.remove('active'));
    win.classList.add('active');
    refreshTaskbarApps();
}

// 开始菜单
function toggleStartMenu(){
    startMenu.classList.toggle('open');
}

// 打开窗口
function openWindow(id,name){
    const win = document.getElementById('win-'+id);
    win.style.display='block';
    setTop(win);
    setTimeout(()=>win.classList.add('show'),10);
    startMenu.classList.remove('open');
    refreshTaskbarApps();
}

// 关闭窗口
function closeWindow(id){
    const win = document.getElementById(id);
    win.classList.remove('show');
    setTimeout(()=>{
        win.style.display='none';
        refreshTaskbarApps();
    },200);
}

// 最小化窗口
function minWindow(id){
    const win = document.getElementById(id);
    win.classList.remove('show');
    setTimeout(()=>{
        win.style.display='none';
        refreshTaskbarApps();
    },200);
}

// 最大化/还原
function maxWindow(id){
    const win = document.getElementById(id);
    setTop(win);
    if(!winState[id]){
        winState[id] = {
            w:win.style.width,
            h:win.style.height,
            l:win.style.left,
            t:win.style.top
        }
        win.style.width = '100vw';
        win.style.height = 'calc(100vh - 48px)';
        win.style.left = '0';
        win.style.top = '0';
    }else{
        win.style.width = winState[id].w;
        win.style.height = winState[id].h;
        win.style.left = winState[id].l;
        win.style.top = winState[id].t;
        winState[id] = null;
    }
}

// 窗口拖拽
let dragTarget = null, offsetX=0, offsetY=0;
function dragWindow(e,winId){
    dragTarget = document.getElementById(winId);
    setTop(dragTarget);
    const rect = dragTarget.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    document.onmousemove = moveDrag;
    document.onmouseup = stopDrag;
}
function moveDrag(e){
    if(!dragTarget) return;
    dragTarget.style.left = (e.clientX - offsetX) + 'px';
    dragTarget.style.top = (e.clientY - offsetY) + 'px';
}
function stopDrag(){dragTarget=null;document.onmousemove=null;document.onmouseup=null;}

// 桌面右键菜单
const rightMenu = document.getElementById('rightMenu');
document.addEventListener('contextmenu',e=>{
    e.preventDefault();
    rightMenu.style.left = e.clientX+'px';
    rightMenu.style.top = e.clientY+'px';
    rightMenu.classList.add('open');
});
document.addEventListener('click',()=>{
    rightMenu.classList.remove('open');
    startMenu.classList.remove('open');
})
</script>
</body>
</html>
