<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页版 Win11</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            height: 100vh;
            overflow: hidden;
            font-family: "Segoe UI Variable", system-ui, sans-serif;
            background: #141414;
        }
        .desktop {
            height: calc(100vh - 48px);
            padding:24px;
            display: flex;
            flex-direction: column;
            gap:28px;
        }
        .desktop-icon{
            width:84px;
            text-align:center;
            color:#ffffff;
            cursor:pointer;
            border-radius:4px;
            padding:6px 4px;
        }
        .desktop-icon:hover{
            background:rgba(255,255,255,0.12);
        }
        .icon-box{
            font-size:42px;
            margin-bottom:8px;
        }
        .taskbar{
            height:48px;
            background:rgba(248,248,248,0.12);
            backdrop-filter: blur(12px);
            position:fixed;
            bottom:0;
            left:0;
            right:0;
            display:flex;
            align-items:center;
            color:#fff;
        }
        .start-btn{
            width:48px;
            height:48px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:22px;
            cursor:pointer;
        }
        .start-btn:hover{
            background:rgba(255,255,255,0.15);
        }
        .taskbar-apps{
            display:flex;
            gap:4px;
            margin-left:8px;
        }
        .task-app-item{
            height:40px;
            padding:0 14px;
            line-height:40px;
            background:rgba(255,255,255,0.08);
            cursor:pointer;
            border-radius:6px;
            font-size:13px;
        }
        .task-app-item:hover{
            background:rgba(255,255,255,0.16);
        }
        .time-area{
            margin-left:auto;
            padding:0 18px;
            text-align:right;
            font-size:12px;
        }
        .start-menu{
            width:340px;
            height:440px;
            background:rgba(28,28,28,0.82);
            backdrop-filter: blur(16px);
            position:absolute;
            bottom:48px;
            left:0;
            display:none;
            color:#fff;
            padding:14px;
            border-radius:12px;
        }
        .start-menu.show{
            display:block;
        }
        .window{
            width:620px;
            height:440px;
            background:#ffffff;
            position:absolute;
            border-radius:10px;
            overflow:hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.35);
            opacity:0;
            transform: scale(0.92);
            transition: 200ms cubic-bezier(0, 0, 0, 1);
            will-change: transform, opacity;
            visibility: visible;
        }
        .window.active{
            opacity:1;
            transform: scale(1);
        }
        .window.min{
            opacity:0;
            transform: scale(0.25) translateY(100vh);
            visibility: hidden;
            pointer-events:none;
        }
        .win-header{
            height:34px;
            background:#ffffff;
            color:#222;
            display:flex;
            align-items:center;
            padding:0 12px;
            cursor:move;
        }
        .win-title{
            flex:1;
            font-size:14px;
        }
        .win-buttons>span{
            width:38px;
            height:34px;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
        }
        .win-buttons>span:hover{
            background:#e5e5e5;
        }
        .win-close:hover{
            background:#e81123 !important;
            color:white;
        }
        .win-body{
            height:calc(100% - 34px);
            overflow:auto;
            padding:14px;
            color:#222;
        }
    </style>
</head>
<body>
    <div class="desktop">
        <div class="desktop-icon" ondblclick="openWindow('notepad','记事本')">
            <div class="icon-box">📄</div>
            <div>记事本</div>
        </div>
        <div class="desktop-icon" ondblclick="openWindow('explorer','此电脑')">
            <div class="icon-box">🖥️</div>
            <div>此电脑</div>
        </div>
    </div>
    <div class="start-menu" id="startMenu">
        <div>应用列表</div>
    </div>
    <div class="taskbar">
        <div class="start-btn" onclick="toggleStart()">⌕</div>
        <div class="taskbar-apps" id="taskApps"></div>
        <div class="time-area">
            <div id="hhmm">00:00</div>
            <div id="yyyymmdd">2026/08/14</div>
        </div>
    </div>
    <script>
        function updateTime(){
            let d=new Date();
            document.getElementById('hhmm').innerText = d.getHours()+":"+String(d.getMinutes()).padStart(2,'0');
            document.getElementById('yyyymmdd').innerText = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
        }
        setInterval(updateTime,1000);
        updateTime();
        function toggleStart(){
            document.getElementById("startMenu").classList.toggle("show");
        }
        document.body.addEventListener('click',e=>{
            if(!e.target.matches('.start-btn')){
                document.getElementById('startMenu').classList.remove('show');
            }
        })
        let zIndex=10;
        let winIdCount=0;
        function openWindow(type,title){
            winIdCount++;
            const winId="win_"+winIdCount;
            zIndex++;
            const win=document.createElement('div');
            win.className="window";
            win.dataset.winid=winId;
            win.dataset.origLeft = (80+Math.random()*140)+"px";
            win.dataset.origTop = (60+Math.random()*110)+"px";
            win.dataset.origW = "620px";
            win.dataset.origH = "440px";
            win.style.left=win.dataset.origLeft;
            win.style.top=win.dataset.origTop;
            win.style.width=win.dataset.origW;
            win.style.height=win.dataset.origH;
            win.style.zIndex=zIndex;
            let bodyHtml="";
            if(type==="notepad"){
                bodyHtml=`<textarea style="width:100%;height:100%;border:none;outline:none;font-size:14px;" placeholder="在此输入文字..."></textarea>`;
            }else if(type==="explorer"){
                bodyHtml=`<div style="padding:20px;">
                    <h3>此电脑</h3>
                    <div style="margin-top:16px;">本地磁盘 (C:)</div>
                    <div style="margin-top:8px;">本地磁盘 (D:)</div>
                </div>`;
            }
            win.innerHTML=`
                <div class="win-header">
                    <div class="win-title">${title}</div>
                    <div class="win-buttons">
                        <span class="win-min">−</span>
                        <span class="win-max">□</span>
                        <span class="win-close">×</span>
                    </div>
                </div>
                <div class="win-body">${bodyHtml}</div>
            `;
            document.body.appendChild(win);
            requestAnimationFrame(()=>{ win.classList.add('active'); });
            const taskApps=document.getElementById('taskApps');
            const taskBtn=document.createElement('div');
            taskBtn.className="task-app-item";
            taskBtn.innerText=title;
            taskBtn.dataset.winid=winId;
            taskBtn.onclick=()=>{
                if(win.classList.contains('min')){
                    win.classList.remove('min');
                    requestAnimationFrame(()=>{
                        win.classList.add('active');
                        zIndex++;
                        win.style.zIndex=zIndex;
                    })
                }else{
                    win.classList.add('min');
                }
            }
            taskApps.appendChild(taskBtn);
            win.querySelector('.win-close').onclick=()=>{
                win.classList.remove('active');
                win.classList.add('min');
                setTimeout(()=>{ win.remove(); taskBtn.remove(); },200);
            };
            win.querySelector('.win-min').onclick=()=>{ win.classList.add('min'); }
            let isMax=false;
            win.querySelector('.win-max').onclick=()=>{
                if(!isMax){
                    win.dataset.saveLeft=win.style.left;
                    win.dataset.saveTop=win.style.top;
                    win.dataset.saveW=win.style.width;
                    win.dataset.saveH=win.style.height;
                    win.style.left="0px";
                    win.style.top="0px";
                    win.style.width="100vw";
                    win.style.height="calc(100vh - 48px)";
                    win.style.borderRadius="0";
                    isMax=true;
                    win.querySelector('.win-max').innerText="❐";
                }else{
                    win.style.left=win.dataset.saveLeft;
                    win.style.top=win.dataset.saveTop;
                    win.style.width=win.dataset.saveW;
                    win.style.height=win.dataset.saveH;
                    win.style.borderRadius="10px";
                    isMax=false;
                    win.querySelector('.win-max').innerText="□";
                }
            }
            win.querySelector('.win-header').onmousedown=()=>{
                zIndex++; win.style.zIndex=zIndex;
            }
            dragWindow(win,win.querySelector('.win-header'),()=>isMax);
        }
        function dragWindow(win,header,getIsMax){
            let dx,dy,isDrag=false;
            header.onmousedown=e=>{
                if(getIsMax()) return;
                isDrag=true;
                dx=e.clientX-win.offsetLeft;
                dy=e.clientY-win.offsetTop;
                document.onmousemove=ev=>{
                    if(!isDrag)return;
                    win.style.left=(ev.clientX-dx)+'px';
                    win.style.top=(ev.clientY-dy)+'px';
                }
                document.onmouseup=()=>{isDrag=false;document.onmousemove=null;}
            }
        }
    </script>
</body>
</html>
